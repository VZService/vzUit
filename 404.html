<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>页面不存在 · vzUit</title>
<link rel="stylesheet" href="/src/tokens.css" />
<style>
  /* 404 页只引 token，不引整片组件样式：这里只有一屏内容，没必要背上 800 行的裸类名 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--vz-space-5);
    background: var(--vz-bg);
    background-image:
      radial-gradient(ellipse at 20% 30%, rgba(88,60,250,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(0,200,255,0.04) 0%, transparent 60%);
    font-family: var(--vz-font-ui);
    color: var(--vz-text);
    line-height: var(--vz-line);
  }
  .box { max-width: 520px; text-align: center; }
  .code {
    font-size: var(--vz-fs-46);
    font-weight: var(--vz-fw-bold);
    letter-spacing: 0.08em;
    background: linear-gradient(135deg, var(--vz-brand-from), var(--vz-brand-to));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .title { font-size: var(--vz-fs-24); font-weight: var(--vz-fw-semibold); margin-top: var(--vz-space-3); }
  .desc { font-size: var(--vz-fs-14); color: var(--vz-text-tertiary); margin-top: var(--vz-space-3); }
  .actions { display: flex; gap: var(--vz-space-3); justify-content: center; flex-wrap: wrap; margin-top: var(--vz-space-5); }
  .btn {
    display: inline-flex;
    align-items: center;
    padding: var(--vz-space-2) var(--vz-space-5);
    border-radius: var(--vz-radius-pill);
    font-size: var(--vz-fs-14);
    font-weight: var(--vz-fw-semibold);
    text-decoration: none;
    transition: background var(--vz-dur), box-shadow var(--vz-dur);
  }
  .btn-primary { background: var(--vz-primary-gradient); color: var(--vz-white); }
  .btn-primary:hover { box-shadow: var(--vz-shadow-primary-hover); }
  .btn-ghost { background: var(--vz-glass-3); border: 1px solid var(--vz-border-2); color: var(--vz-text); }
  .btn-ghost:hover { background: var(--vz-surface-raised); border-color: var(--vz-border-3); }
  .btn:focus-visible { outline: 2px solid var(--vz-border-focus); outline-offset: 2px; }
  .foot { font-size: var(--vz-fs-12); color: var(--vz-text-disabled); margin-top: var(--vz-space-6); }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <div class="title">这个地址没有内容</div>
    <p class="desc">链接可能拼错了，或者对应的文件在这版规范里还没写。</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">回到演示页</a>
      <a class="btn btn-ghost" href="/specs/02-css.md">看 CSS 规范</a>
    </div>
    <div class="foot">vzUit · VZService 统一标准</div>
  </div>
</body>
</html>
